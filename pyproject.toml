[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krem"
version = "0.1.0"
description = "F1 25 Telemetry Dashboard — real-time UDP telemetry viewer with AI coaching"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
coach = [
    "google-genai>=1.0",
]

[project.scripts]
krem = "krem.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["krem"]
